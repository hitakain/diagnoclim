  }
}
:root[data-theme="dark"] {
  --ink: #e9eff5;
  --topbar-bg: #060d14;
  --ink-soft: #a8b8c7;

  --line: #22303f;
  --line-strong: #33455a;
  --bg: #0a1119;
  --surface: #121c26;
  --surface-alt: #16222e;
  --accent: #2bb7cd;
  --accent-ink: #04202a;
  --accent-soft: #10303a;
  --warn: #e0a458;

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  -webkit-text-size-adjust: 100%;
  padding-bottom: env(safe-area-inset-bottom);
}

/* ---------- en-tête ------------------------------------------------------- */
.topbar {
  position: sticky; top: 0; z-index: 30;
  display: flex; align-items: center; gap: 12px;
  padding: calc(10px + env(safe-area-inset-top)) 16px 10px;
  background: var(--topbar-bg); color: #fff;
}
.topbar .logo {
  width: 36px; height: 36px; flex: none; border-radius: 10px;
  display: grid; place-items: center; background: var(--accent); color: var(--accent-ink);
  font-weight: 800; font-size: 15px; letter-spacing: -.5px;
}
.topbar .title { min-width: 0; }
.topbar h1 { margin: 0; font-size: 15px; font-weight: 650; letter-spacing: .1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.topbar p { margin: 0; font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: #93a7ba; }
.topbar .spacer { flex: 1; }
.topbar button {
  flex: none;
  border: 1px solid rgba(255, 255, 255, .22); background: rgba(255, 255, 255, .07);
  color: #fff; border-radius: 10px; padding: 7px 10px; font-size: 13px; font-weight: 550;
}
@media (max-width: 430px) {
  .topbar { gap: 8px; padding-left: 12px; padding-right: 12px; }
  .topbar button { padding: 7px 8px; font-size: 12px; }
  .topbar p { display: none; }
  .topbar h1 { font-size: 13px; }
  .topbar .logo { width: 32px; height: 32px; font-size: 13px; }
}
.topbar button[aria-current="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }

/* ---------- étapes -------------------------------------------------------- */
.steps { display: flex; gap: 6px; overflow-x: auto; padding: 10px 12px; background: var(--surface); border-bottom: 1px solid var(--line); scrollbar-width: none; }
.steps::-webkit-scrollbar { display: none; }
.steps button {
  flex: none; display: flex; align-items: center; gap: 7px;
  border: 1px solid var(--line); background: var(--surface-alt); color: var(--ink-soft);
  border-radius: 999px; padding: 7px 13px 7px 8px; font-size: 13px; font-weight: 550; white-space: nowrap;
}
.steps button .n {
  width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center;
  background: var(--line); color: var(--ink-soft); font-size: 11px; font-weight: 700;
}
.steps button.done { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 35%, transparent); }
.steps button.done .n { background: color-mix(in srgb, var(--ok) 18%, transparent); color: var(--ok); }
.steps button.active { background: var(--ink); border-color: var(--ink); color: #fff; }
.steps button.active .n { background: var(--accent); color: var(--accent-ink); }

/* ---------- structure ----------------------------------------------------- */
main { max-width: 720px; margin: 0 auto; padding: 14px 14px 120px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 16px; margin-bottom: 14px; }
.card > h2 { margin: 0 0 2px; font-size: 17px; font-weight: 680; letter-spacing: -.1px; }
.card > h2 + p { margin: 0 0 14px; color: var(--ink-soft); font-size: 13px; }
.legend { margin: 18px 0 10px; font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-faint); display: flex; align-items: center; gap: 8px; }
.legend::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.legend:first-child { margin-top: 0; }

.grid { display: grid; gap: 12px; grid-template-columns: 1fr; }
@media (min-width: 560px) { .grid.two { grid-template-columns: 1fr 1fr; } .grid .full { grid-column: 1 / -1; } }

label.field { display: block; }
label.field > span { display: block; font-size: 12px; font-weight: 600; color: var(--ink-soft); margin-bottom: 5px; }
label.field .hint { font-weight: 400; color: var(--ink-faint); }

input[type="text"], input[type="date"], input[type="number"], input[type="tel"], select, textarea {
  width: 100%; font: inherit; color: var(--ink); background: var(--surface-alt);
  border: 1px solid var(--line-strong); border-radius: 10px; padding: 11px 12px; min-height: 44px;
  appearance: none;
}
textarea { min-height: 84px; resize: vertical; line-height: 1.4; }
select { background-image: linear-gradient(45deg, transparent 50%, var(--ink-soft) 50%), linear-gradient(135deg, var(--ink-soft) 50%, transparent 50%); background-position: calc(100% - 18px) 50%, calc(100% - 13px) 50%; background-size: 5px 5px, 5px 5px; background-repeat: no-repeat; padding-right: 34px; }
input:focus, select:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: 1px; border-color: var(--accent); }
input::placeholder, textarea::placeholder { color: var(--ink-faint); }

/* ---------- cases et choix ------------------------------------------------ */
.choices { display: grid; gap: 8px; }
.choices.two { grid-template-columns: 1fr 1fr; }
.choice {
  display: flex; align-items: flex-start; gap: 10px; padding: 11px 12px;
  border: 1px solid var(--line-strong); border-radius: 10px; background: var(--surface-alt);
  font-size: 14px; line-height: 1.3; cursor: pointer; min-height: 44px;
}
.choice input { margin: 1px 0 0; width: 19px; height: 19px; flex: none; accent-color: var(--accent); }
.choice.on { border-color: var(--accent); background: var(--accent-soft); color: var(--ink); font-weight: 550; }
.choice b { display: block; font-weight: 620; }
.choice small { display: block; color: var(--ink-soft); font-size: 12px; font-weight: 400; }

.segment { display: flex; gap: 6px; }
.segment button {
  flex: 1; min-height: 44px; border: 1px solid var(--line-strong); background: var(--surface-alt);
  color: var(--ink-soft); border-radius: 10px; font: inherit; font-weight: 550;
}
.segment button.on { background: var(--ink); border-color: var(--ink); color: #fff; }

/* ---------- encarts ------------------------------------------------------- */
.panel { border: 1px solid var(--line); border-radius: 12px; padding: 13px 14px; background: var(--surface-alt); }
.panel.accent { border-color: color-mix(in srgb, var(--accent) 40%, transparent); background: var(--accent-soft); }
.panel.warn { border-color: color-mix(in srgb, var(--warn) 40%, transparent); background: var(--warn-soft); }
.panel.danger { border-color: color-mix(in srgb, var(--danger) 45%, transparent); background: var(--danger-soft); }
.panel h3 { margin: 0 0 8px; font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-soft); }
.panel ul { margin: 0; padding-left: 18px; }
.panel li { margin: 3px 0; font-size: 13px; }

.readout { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; }
.readout div { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
.readout span { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-faint); }
.readout strong { display: block; font-size: 18px; font-weight: 700; letter-spacing: -.3px; margin-top: 2px; }
.readout small { color: var(--ink-soft); font-size: 12px; }

/* ---------- photo --------------------------------------------------------- */
.photo { position: relative; border: 1.5px dashed var(--line-strong); border-radius: 12px; background: var(--surface-alt); min-height: 132px; display: grid; place-items: center; overflow: hidden; text-align: center; padding: 18px; }
.photo img { width: 100%; max-height: 260px; object-fit: contain; display: block; }
.photo .ph { color: var(--ink-faint); font-size: 13px; }
.photo-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }
.filebtn { position: relative; overflow: hidden; display: grid; place-items: center; min-height: 44px; border: 1px solid var(--line-strong); border-radius: 10px; background: var(--surface-alt); font-size: 14px; font-weight: 550; color: var(--ink); }
.filebtn input { position: absolute; inset: 0; opacity: 0; font-size: 200px; cursor: pointer; }

/* ---------- signature ----------------------------------------------------- */
.sign { scroll-margin: 90px 0 110px; border: 1px solid var(--line-strong); border-radius: 12px; overflow: hidden; background: #fff; }
.sign header { display: flex; align-items: center; justify-content: space-between; padding: 8px 12px; background: var(--surface-alt); border-bottom: 1px solid var(--line); }
.sign header b { font-size: 13px; color: var(--ink); }
.sign header button { border: none; background: none; color: var(--accent); font: inherit; font-size: 13px; font-weight: 600; padding: 4px; }
.sign canvas { display: block; width: 100%; height: 150px; touch-action: none; background: #fff; }
.sign p { margin: 0; padding: 6px 12px 8px; font-size: 11px; color: var(--ink-faint); background: var(--surface-alt); border-top: 1px solid var(--line); }

/* ---------- boutons ------------------------------------------------------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 46px; padding: 0 18px; border-radius: 11px; border: 1px solid var(--line-strong); background: var(--surface-alt); color: var(--ink); font: inherit; font-weight: 600; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.dark { background: var(--ink); border-color: var(--ink); color: #fff; }
.btn.ghost { background: none; border-color: transparent; color: var(--accent); }
.btn.danger { color: var(--danger); border-color: color-mix(in srgb, var(--danger) 40%, transparent); background: var(--danger-soft); }
.btn.block { display: flex; width: 100%; }
.btn[disabled] { opacity: .45; }

.actions { position: fixed; left: 0; right: 0; bottom: 0; z-index: 25; display: flex; gap: 10px; padding: 10px 14px calc(10px + env(safe-area-inset-bottom)); background: color-mix(in srgb, var(--surface) 88%, transparent); backdrop-filter: blur(12px); border-top: 1px solid var(--line); }
.actions .btn { flex: 1; }
.actions .inner { display: flex; gap: 10px; width: 100%; max-width: 720px; margin: 0 auto; }

/* ---------- historique ---------------------------------------------------- */
.fiche { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.fiche:last-child { border-bottom: none; }
.fiche .meta { flex: 1; min-width: 0; }
.fiche .meta b { display: block; font-size: 14px; font-weight: 620; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.fiche .meta span { display: block; font-size: 12px; color: var(--ink-soft); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.fiche .num { font-variant-numeric: tabular-nums; font-size: 12px; font-weight: 700; color: var(--accent); background: var(--accent-soft); border-radius: 7px; padding: 4px 7px; }
.fiche button { border: 1px solid var(--line-strong); background: var(--surface-alt); color: var(--ink); border-radius: 9px; min-height: 38px; padding: 0 11px; font: inherit; font-size: 13px; font-weight: 550; }
.empty { text-align: center; color: var(--ink-faint); padding: 28px 10px; font-size: 14px; }

/* ---------- divers -------------------------------------------------------- */
.toast { position: fixed; left: 50%; bottom: 84px; transform: translateX(-50%); z-index: 60; max-width: min(560px, calc(100vw - 28px)); background: var(--ink); color: #fff; padding: 12px 16px; border-radius: 12px; font-size: 14px; box-shadow: var(--shadow); opacity: 0; pointer-events: none; transition: opacity .18s, transform .18s; }
.toast.show { opacity: 1; transform: translateX(-50%) translateY(-4px); }
.toast.err { background: var(--danger); }
.hidden { display: none !important; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.muted { color: var(--ink-soft); font-size: 13px; }
.tiny { font-size: 12px; color: var(--ink-faint); }
hr.sep { border: none; border-top: 1px solid var(--line); margin: 16px 0; }


</style>
</head>

    '˜': 0x98, '™': 0x99, 'š': 0x9a, '›': 0x9b,
    'œ': 0x9c, 'ž': 0x9e, 'Ÿ': 0x9f,
  };

  // µ, ² et ³ existent dans WinAnsi mais restent invisibles dans certaines
  // visionneuses PDF qui substituent l'Helvetica : on les translittère.
  const FALLBACK = {
    'µ': 'u', 'μ': 'u', '²': '2', '³': '3', '¹': '1', '±': '+/-',
    '₂': '2', '₁': '1', '₃': '3', '≤': '<=', '≥': '>=',
    '≠': '!=', ' ': ' ', ' ': ' ', ' ': ' ', '−': '-',
    '̀': '', '́': '', '→': '->',
  };

  function winAnsiCodes(str) {
    const out = [];
    for (const ch of String(str == null ? '' : str)) {
      if (FALLBACK[ch] !== undefined) {
        for (const c of FALLBACK[ch]) out.push(c.charCodeAt(0));
        continue;
      }
      const code = ch.codePointAt(0);
      if (code === 0x0a || code === 0x0d) { out.push(code); continue; }
      if (code >= 0x20 && code <= 0x7e) { out.push(code); continue; }
      if (WIN_EXTRA[ch] !== undefined) { out.push(WIN_EXTRA[ch]); continue; }
      if (code >= 0xa0 && code <= 0xff) { out.push(code); continue; }
      out.push(0x3f); // ?
    }

    for (const code of winAnsiCodes(str)) {
      const ch = String.fromCharCode(code);

      let current = '';
      for (const word of paragraph.split(/\s+/)) {

        if (textWidth(candidate, size, bold) <= maxWidth || !current) {

    constructor() { this.buf = []; }
    raw(s) { this.buf.push(s); return this; }

      this.buf.push(
        'BT ' + rgb.map((v) => v.toFixed(3)).join(' ') + ' rg /' +
        (bold ? 'KEZHB' : 'KEZH') + ' ' + size.toFixed(2) + ' Tf ' +
        x.toFixed(2) + ' ' + y.toFixed(2) + ' Td ' + pdfString(str) + ' Tj ET'

      const rect = FIELDS[name];
      if (!rect) throw new Error('champ inconnu : ' + name);

      if (!text) return this;
      const o = opt || {};
      const padX = o.padX == null ? 2 : o.padX;
      const x0 = rect[0] + padX, y0 = rect[1], x1 = rect[2] - padX, y1 = rect[3];
      const boxW = x1 - x0, boxH = y1 - y0;
      const bold = !!o.bold;
      const maxSize = o.size || 8;
      const minSize = o.minSize || 5;
      const multiline = o.multiline !== false && (boxH > 13 || /\n/.test(text));

      if (!multiline) {
        let size = maxSize;
        while (size > minSize && textWidth(text, size, bold) > boxW) size -= 0.25;
        let out = text;
        if (textWidth(out, size, bold) > boxW) {
          while (out.length > 1 && textWidth(out + '.', size, bold) > boxW) out = out.slice(0, -1);
          out += '.';
        }
        const w = textWidth(out, size, bold);
        let x = x0;
        if (o.align === 'center') x = x0 + (boxW - w) / 2;
        else if (o.align === 'right') x = x1 - w;
        const y = y0 + (boxH - size * 0.72) / 2 + size * 0.06;
        return this.line(out, x, Math.max(y, y0 + 1), size, bold, o.color);

      let leading = size * 1.18;

        let x = x0;
        if (o.align === 'center') x = x0 + (boxW - textWidth(l, size, bold)) / 2;
        else if (o.align === 'right') x = x1 - textWidth(l, size, bold);

      const x0 = rect[0] + i, y0 = rect[1] + i, x1 = rect[2] - i, y1 = rect[3] - i;

        x0.toFixed(2) + ' ' + y0.toFixed(2) + ' m ' + x1.toFixed(2) + ' ' + y1.toFixed(2) + ' l S ' +
        x0.toFixed(2) + ' ' + y1.toFixed(2) + ' m ' + x1.toFixed(2) + ' ' + y0.toFixed(2) + ' l S Q'
      );

    }

    dot(name) {

      const r = Math.min(rect[2] - rect[0], rect[3] - rect[1]) / 2 - 1.4;

      this.buf.push(
        'q 0.03 0.10 0.17 rg ' +
        f(cx + r) + ' ' + f(cy) + ' m ' +
        f(cx + r) + ' ' + f(cy + k) + ' ' + f(cx + k) + ' ' + f(cy + r) + ' ' + f(cx) + ' ' + f(cy + r) + ' c ' +
        f(cx - k) + ' ' + f(cy + r) + ' ' + f(cx - r) + ' ' + f(cy + k) + ' ' + f(cx - r) + ' ' + f(cy) + ' c ' +
        f(cx - r) + ' ' + f(cy - k) + ' ' + f(cx - k) + ' ' + f(cy - r) + ' ' + f(cx) + ' ' + f(cy - r) + ' c ' +
        f(cx + k) + ' ' + f(cy - r) + ' ' + f(cx + r) + ' ' + f(cy - k) + ' ' + f(cx + r) + ' ' + f(cy) + ' c f Q'
      );
      return this;
    }

    image(resName, x, y, w, h) {
      this.buf.push('q ' + w.toFixed(2) + ' 0 0 ' + h.toFixed(2) + ' ' +
        x.toFixed(2) + ' ' + y.toFixed(2) + ' cm /' + resName + ' Do Q');

    }

    toString() { return this.buf.join('\n'); }
  }

  /* ---------- octets ------------------------------------------------------- */
  function b64ToBytes(b64) {
    if (typeof atob === 'function') {
      const bin = atob(b64);
      const out = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
      return out;
    }
    return new Uint8Array(Buffer.from(b64, 'base64'));
  }

  function strToBytes(str) {
    const out = new Uint8Array(str.length);
    for (let i = 0; i < str.length; i++) out[i] = str.charCodeAt(i) & 0xff;
    return out;
  }

  /** Dimensions d'un JPEG (marqueur SOFn). */
  function jpegSize(bytes) {
    let i = 2;
    while (i < bytes.length) {
      if (bytes[i] !== 0xff) { i++; continue; }
      const marker = bytes[i + 1];
      if (marker >= 0xc0 && marker <= 0xcf && marker !== 0xc4 && marker !== 0xc8 && marker !== 0xcc) {
        return { h: (bytes[i + 5] << 8) | bytes[i + 6], w: (bytes[i + 7] << 8) | bytes[i + 8] };
      }
      i += 2 + ((bytes[i + 2] << 8) | bytes[i + 3]);
    }
    return { w: 0, h: 0 };
  }

  /* ---------- assemblage du PDF ------------------------------------------- */
  /**
   * @param {Ops} ops  calque à dessiner
   * @param {Array} images  [{ name, bytes }] images JPEG référencées par le calque
   */
  function assemble(ops, images) {
    const base = b64ToBytes(A.skeleton);
    const parts = [base];
    let offset = base.length;
    const xref = [];           // { num, offset }
    let next = A.pdf.size;

    const push = (str) => {
      const bytes = typeof str === 'string' ? strToBytes(str) : str;
      parts.push(bytes);
      offset += bytes.length;
    };
    const addObject = (num, body, streamBytes) => {
      xref.push({ num, offset });
      push(num + ' 0 obj\n' + body);
      if (streamBytes) { push('\nstream\n'); push(streamBytes); push('\nendstream'); }
      push('\nendobj\n');
    };

    const fontRegular = next++;
    const fontBold = next++;
    const imageNums = images.map(() => next++);
    const layerNum = next++;
    const contentNum = next++;

    addObject(fontRegular, '<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>');
    addObject(fontBold, '<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>');

    images.forEach((img, i) => {
      const dim = jpegSize(img.bytes);
      addObject(imageNums[i],
        '<< /Type /XObject /Subtype /Image /Width ' + dim.w + ' /Height ' + dim.h +
        ' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ' + img.bytes.length + ' >>',
        img.bytes);
    });

    const layerXObjects = images.map((img, i) => '/' + img.name + ' ' + imageNums[i] + ' 0 R').join(' ');
    const layerStream = strToBytes(ops.toString());
    addObject(layerNum,
      '<< /Type /XObject /Subtype /Form /FormType 1 /BBox [ ' + A.pdf.mediaBox.join(' ') + ' ]' +
      ' /Resources << /ProcSet [ /PDF /Text /ImageC ] /Font << /KEZH ' + fontRegular + ' 0 R /KEZHB ' + fontBold + ' 0 R >>' +
      (layerXObjects ? ' /XObject << ' + layerXObjects + ' >>' : '') + ' >>' +
      ' /Length ' + layerStream.length + ' >>',
      layerStream);

    const invoke = strToBytes('q /KEZLAYER Do Q');
    addObject(contentNum, '<< /Length ' + invoke.length + ' >>', invoke);

    const pageBody = A.pdf.pageTemplate
      .replace('%CONTENT%', contentNum + ' 0 R')
      .replace('%XOBJ%', '/KEZLAYER ' + layerNum + ' 0 R');
    addObject(A.pdf.pageObj, pageBody);

    // table de références croisées (sections triées par numéro d'objet)
    xref.sort((a, b) => a.num - b.num);
    const sections = [];
    for (const entry of xref) {
      const last = sections[sections.length - 1];
      if (last && entry.num === last.start + last.entries.length) last.entries.push(entry);
      else sections.push({ start: entry.num, entries: [entry] });
    }
    const xrefOffset = offset;
    let table = 'xref\n';
    for (const section of sections) {
      table += section.start + ' ' + section.entries.length + '\n';
      for (const entry of section.entries) {
        table += ('0000000000' + entry.offset).slice(-10) + ' 00000 n \n';
      }
    }
    table += 'trailer\n<< /Size ' + next + ' /Root ' + A.pdf.root +
      (A.pdf.info ? ' /Info ' + A.pdf.info : '') +
      (A.pdf.id ? ' /ID [ ' + A.pdf.id + ' ]' : '') +
      ' /Prev ' + A.pdf.startxref + ' >>\nstartxref\n' + xrefOffset + '\n%%EOF\n';
    push(table);

    const out = new Uint8Array(offset);
    let at = 0;
    for (const part of parts) { out.set(part, at); at += part.length; }
    return out;
  }

  return { Ops, assemble, textWidth, wrap, sanitize, b64ToBytes, jpegSize, FIELDS, PAGE_H };
})();

    return { erreurs, avertissements };
  }

  /** Construit le calque à imprimer par-dessus le CERFA. */
  function dessiner(form, signatures) {
    const ops = new KezPdf.Ops();
    const fluide = fluidOf(form.fluide);
    const teq = teqCO2(form);
    const t = totaux(form);

    /* --- [1] opérateur, [2] détenteur, n° de fiche ------------------------- */
    ops.field('Fiche_no', form.ficheNo, { align: 'center', size: 9, bold: true });
    ops.field('Operateur', [form.operateurNom, form.operateurAdresse,
      form.operateurSiret ? 'SIRET : ' + form.operateurSiret : ''].filter(Boolean).join('\n'), { size: 8 });
    ops.field('Attestation_no', form.attestationNo, { size: 8 });
    ops.field('Detenteur', [form.detenteurNom, form.detenteurAdresse,
      form.detenteurSiret ? 'SIRET : ' + form.detenteurSiret : ''].filter(Boolean).join('\n'), { size: 8 });

    /* --- [3] équipement ---------------------------------------------------- */
    const identification = form.equipementId || [
      form.marque, form.modele,
      form.serie ? 'N° série ' + form.serie : '',
      form.localisation,
    ].filter(Boolean).join(' — ');
    ops.field('Equipement_ID', identification, { size: 8 });
    ops.field('Equipement_Fluide', fluide ? fluide.nom.replace(/^R-?/i, '') : '', { size: 8, bold: true });
    ops.field('Equipement_Charge', kg(form.charge), { align: 'right', size: 8 });
    ops.field('Equipement_teqCO2', teqStr(teq), { align: 'right', size: 8 });

    /* --- [4] nature de l'intervention -------------------------------------- */
    for (const nature of NATURES) {
      if ((form.natures || []).includes(nature.id)) ops.check(nature.case);
    }
    if ((form.natures || []).includes('autre')) ops.field('Autre', form.autrePrecision, { size: 7.5 });

    /* --- [5] détecteur manuel + date du contrôle --------------------------- */
    ops.field('Detecteur_ID', form.detecteurId, { size: 7.5 });
    if (form.controleDate) {
      const [annee, mois, jour] = form.controleDate.split('-');
      ops.field('Controle_Jour', jour, { align: 'center', size: 8 });
      ops.field('Controle_Mois', mois, { align: 'center', size: 8 });
      ops.field('Controle_Annee', annee, { align: 'center', size: 8 });
    }

    /* --- [6] détection permanente ------------------------------------------ */
    if (form.detecteurPermanent === 'oui') ops.dot('Bouton_Oui#1');
    else if (form.detecteurPermanent === 'non') ops.dot('Bouton_Oui#2');

    /* --- [7] [8] [9] seuils et fréquence ----------------------------------- */
    const s = seuils(form);
    if (s.quantite) ops.check(s.quantite);
    if (s.frequence) ops.check(s.frequence);

    /* --- [10] fuites constatées -------------------------------------------- */
    if (form.controleEtancheite) {
      if (form.fuiteConstatee === 'oui') ops.check('Case_Fuite_Oui');
      else if (form.fuiteConstatee === 'non') ops.check('Case_Fuite_Non');
      (form.fuites || []).slice(0, 3).forEach((fuite, i) => {
        if (!fuite || (!fuite.loca && !fuite.rep)) return;
        ops.field('Fuite_Loca_' + (i + 1), fuite.loca, { size: 7.5 });
        if (fuite.rep === 'realisee') ops.check('Case_Rep_Fuite' + (i + 1) + '_realisee');
        else if (fuite.rep === 'afaire') ops.check('Case_Rep_Fuite' + (i + 1) + '_AFaire');
      });
    }

    /* --- [11] manipulation du fluide --------------------------------------- */
    if (form.manipulation) {
      if (t.chargee > 0) {
        ops.field('11_Quantite', kg(t.chargee), { align: 'right', size: 8 });
        ops.field('11_QA', kg(form.qteVierge), { align: 'right', size: 8 });
        if (num(form.qteRecycle)) ops.field('11_QB', kg(form.qteRecycle), { align: 'right', size: 8 });
        if (num(form.qteRegenere)) ops.field('11_QC', kg(form.qteRegenere), { align: 'right', size: 8 });
        ops.field('11_Denom', form.denomChange, { size: 7.5 });
      }
      if (t.recuperee > 0) {
        ops.field('11_QDE', kg(t.recuperee), { align: 'right', size: 8 });
        if (num(form.qteTraitement)) ops.field('11_QD', kg(form.qteTraitement), { align: 'right', size: 8 });
        if (num(form.qteReutilisation)) ops.field('11_QE', kg(form.qteReutilisation), { align: 'right', size: 8 });
        ops.field('11_BSFF', form.bsff, { size: 7 });
        ops.field('11_Contenant_ID', form.contenants, { size: 7 });
      }

      /* --- [12] dénomination ADR/RID, uniquement si récupération ----------- */
      if (num(form.qteTraitement) > 0 && fluide) {
        if (fluide.inflammable) ops.check('Case_12_UN3161');
        else ops.check('Case_12_UN1078');
      }

      /* --- [13] destination du fluide récupéré ----------------------------- */
      ops.field('13_Instal', form.installDestination, { size: 7.5 });
    }

    /* --- [14] observations -------------------------------------------------- */
    ops.field('14_Observations', form.observations, { size: 8 });

    /* --- signatures --------------------------------------------------------- */
    ops.field('Sign_Operateur_Nom', form.signOpNom, { size: 8 });
    ops.field('Sign_Operateur_Qualite', form.signOpQualite, { size: 8 });
    ops.field('Sign_Detenteur_Nom', form.signDetNom || form.detenteurNom, { size: 8 });
    ops.field('Sign_Detenteur_Qualite', form.signDetQualite, { size: 8 });

    const dateTexte = dateFr(form.dateIntervention);
    const images = [];
    const poser = (champ, nomImage, signature) => {
      const rect = KezPdf.FIELDS[champ];
      ops.line(dateTexte, rect[0] + 3, rect[1] + (rect[3] - rect[1]) / 2 - 2.5, 7, false);
      if (!signature || !signature.bytes || !signature.bytes.length) return;
      const dim = KezPdf.jpegSize(signature.bytes);
      if (!dim.w || !dim.h) return;
      // La signature peut déborder au-dessus du champ : la cellule « Date et
      // signature » du CERFA est plus haute que la zone de saisie d'origine.
      const zoneX = rect[0] + 52, zoneW = rect[2] - 2 - zoneX;
      const zoneY = rect[1] + 1.5, zoneH = 71.5 - zoneY;
      const ratio = Math.min(zoneW / dim.w, zoneH / dim.h);
      const w = dim.w * ratio, h = dim.h * ratio;
      images.push({ name: nomImage, bytes: signature.bytes });
      ops.image(nomImage, zoneX + (zoneW - w) / 2, zoneY + (zoneH - h) / 2, w, h);
    };
    poser('Sign_Operateur_Date', 'KEZSIG1', signatures && signatures.operateur);
    poser('Sign_Detenteur_Date', 'KEZSIG2', signatures && signatures.detenteur);

    return { ops, images };
  }

  function genererPdf(form, signatures) {
    const { ops, images } = dessiner(form, signatures);
    return KezPdf.assemble(ops, images);
  }

  function nomFichier(form) {
    const client = (form.detenteurNom || 'intervention').normalize('NFD').replace(/[̀-ͯ]/g, '');
    const base = ['CERFA-15497', form.ficheNo, client, form.dateIntervention]
      .filter(Boolean).join('-');
    return base.replace(/[^A-Za-z0-9._-]+/g, '-').replace(/-+/g, '-') + '.pdf';
  }

  return { FLUIDES, NATURES, fluidOf, num, kg, teqCO2, seuils, prochainControle, dateFr, totaux, validation, dessiner, genererPdf, nomFichier };
})();

if (typeof module !== 'undefined' && module.exports) module.exports = { KezLogic, FLUIDES, NATURES };

<script>

(() => {
  'use strict';

    const node = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs || {})) {
      if (v == null || v === false) continue;
      if (k === 'class') node.className = v;
      else if (k === 'html') node.innerHTML = v;
      else if (k.startsWith('on')) node.addEventListener(k.slice(2), v);
      else if (k in node && k !== 'list' && k !== 'type') node[k] = v;
      else node.setAttribute(k, v === true ? '' : v);
    }
    for (const kid of kids.flat()) {
      if (kid == null || kid === false) continue;
      node.appendChild(typeof kid === 'string' ? document.createTextNode(kid) : kid);
    }

  }

  let toastTimer;
  function toast(message, kind) {

        return raw == null ? fallback : JSON.parse(raw);
      } catch (e) { return memoire[key] !== undefined ? memoire[key] : fallback; }
    },
    ecrire(key, value) {
      memoire[key] = value;
      try { window.localStorage.setItem(key, JSON.stringify(value)); return true; }
      catch (e) {
        if (stockageOk) {
          stockageOk = false;

        }
        return false;
      }
    },
  };

  const CLE_FICHES = 'kez.cerfa.fiches';
  const CLE_BROUILLON = 'kez.cerfa.brouillon';

  /* ---------- état --------------------------------------------------------- */
  const aujourdhui = () => new Date().toISOString().slice(0, 10);

  const REGLAGES_DEFAUT = {

  let fiche = null;

  function ficheVierge() {
    return {
      id: 'f' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
      ficheNo: numeroSuivant(),

      natures: [], autrePrecision: '',
      detecteurId: reglages.detecteurId, controleDate: '',
      detecteurPermanent: 'non',

  /* Certains cadres d'affichage bloquent les fenêtres de confirmation :

  function confirmer(question, defautSiBloque) {
    try {
      const reponse = window.confirm(question);
      return typeof reponse === 'boolean' ? reponse : defautSiBloque;
    } catch (e) { return defautSiBloque; }
  }

  /* ---------- composants de formulaire ------------------------------------- */
  function lier(input, cle, apres) {
    input.value = fiche[cle] == null ? '' : fiche[cle];
    input.addEventListener('input', () => {
      fiche[cle] = input.value;
      sauverBrouillon();
      rafraichir();
      if (apres) apres(input.value);
    });
    return input;
  }

  function champ(libelle, cle, opts) {
    const o = opts || {};
    let input;
    if (o.type === 'textarea') input = el('textarea', { rows: o.rows || 3, placeholder: o.placeholder || '' });
    else if (o.type === 'select') {
      input = el('select', {}, ...o.options.map((opt) => el('option', { value: opt.value }, opt.label)));
    } else input = el('input', { type: o.type || 'text', placeholder: o.placeholder || '', inputMode: o.inputMode || null, autocomplete: 'off' });
    lier(input, cle, o.apres);
    return el('label', { class: 'field' + (o.full ? ' full' : '') },
      el('span', {}, libelle, o.hint ? el('span', { class: 'hint' }, ' — ' + o.hint) : null),
      input);
  }

  function segment(libelle, cle, options, apres) {
    const boutons = options.map((opt) => el('button', {
      type: 'button',
      class: fiche[cle] === opt.value ? 'on' : '',
      onclick() {
        fiche[cle] = opt.value;
        for (const b of boutons) b.className = '';
        this.className = 'on';
        sauverBrouillon();
        if (apres) apres(opt.value); else rafraichir();
      },
    }, opt.label));
    return el('label', { class: 'field' }, el('span', {}, libelle), el('div', { class: 'segment' }, ...boutons));
  }

  function bascule(titre, sousTitre, cle, apres) {
    const input = el('input', { type: 'checkbox', checked: !!fiche[cle] });
    const wrap = el('label', { class: 'choice' + (fiche[cle] ? ' on' : '') }, input,
      el('div', {}, el('b', {}, titre), sousTitre ? el('small', {}, sousTitre) : null));
    input.addEventListener('change', () => {
      fiche[cle] = input.checked;
      wrap.className = 'choice' + (input.checked ? ' on' : '');
      sauverBrouillon();
      if (apres) apres(input.checked); else rafraichir();
    });
    return wrap;
  }

  /* ---------- lecture de la plaque par l'IA --------------------------------
     Disponible quand la page est ouverte depuis claude.ai : la photo est
     envoyée à Claude qui renvoie les champs. Demande une connexion, et le
     premier usage demande l'accord de l'utilisateur. */
  const analyse = { capacite: undefined, enCours: false, message: '', erreur: false,
    plateforme: false, lecture: false, images: false, texte: null, raison: '' };
  let photoAnalyse = '';   // copie plus fine, uniquement pour la lecture

  /* La sonde est partagée : tant qu'elle n'a pas répondu, tout appelant attend

  let sondeCapacite = null;

  function capaciteAnalyse() {
    if (sondeCapacite) return sondeCapacite;

      if (typeof window.claude === 'undefined' || typeof window.claude.use !== 'function') {

  function dataUrlVersBlob(dataUrl) {

  }

  function majEtatSortie() {
    const zone = document.getElementById('etat-sortie');
    if (!zone) return;

          "Le PDF sera proposé à l'enregistrement : Fichiers, Mail, ou la messagerie de ton choix.")));

          "Cette vue ne peut pas enregistrer de fichier : le PDF ne pourra pas sortir d'ici. "
          + "Ouvre la page dans l'app Claude, ou utilise la version installée sur ton domaine.")));

  function majEtatAnalyse() {
    const zone = document.getElementById('etat-analyse');
    if (!zone) return;
    zone.textContent = '';

    // Ligne permanente : l'utilisateur sait avant même de photographier.

    if (analyse.capacite === null) {

    } else if (analyse.message) {
      zone.appendChild(el('div', { class: 'panel' + (analyse.erreur ? ' warn' : ''), style: 'margin-top:8px' },

  /** Envoie la photo à Claude et reprend les champs reconnus. */

    analyse.enCours = true;

    try {
      const lu = await sample.json(invitePlaque(), {
        images: image,

      });
      const repris = appliquerLecture(lu);
      analyse.enCours = false;
      if (!repris.length) {
        analyse.message = (lu && lu.lisible === false)
          ? "Photo trop floue ou pas une plaque signalétique. Reprends la photo bien à plat."
          : "Rien n'a pu être lu sur cette photo. Saisis les valeurs à la main.";
        analyse.erreur = true;
        majEtatAnalyse();
        return;
      }
      analyse.message = 'Repris de la photo : ' + repris.join(', ') + '. Vérifie chaque valeur.';
      analyse.erreur = false;
      construire();
    } catch (erreur) {
      analyse.enCours = false;
      const code = erreur && erreur.code;
      if (code === 'cancelled') { majEtatAnalyse(); return; }
      analyse.message = MESSAGES_IA[code] || "Lecture impossible pour le moment. Réessaie ou colle le texte de la plaque.";
      analyse.erreur = true;
      majEtatAnalyse();
    }
  }

  /* Seconde voie d'import : coller une image copiée. Utile si le sélecteur de
     fichiers est bloqué par l'application qui affiche la page. */
  function imageDuPressePapiers(event) {

      if (item.kind === 'file' && String(item.type).startsWith('image/')) {

      '',

  /** Reprend les champs d'un objet renvoyé par l'IA. Renvoie les noms repris. */
  function appliquerLecture(lu) {
    const valeur = (v) => (typeof v === 'string' && v.trim() ? v.trim() : '');
    const repris = [];
    const modifications = {};
    if (valeur(lu && lu.marque)) { modifications.marque = valeur(lu.marque); repris.push('marque'); }
    if (valeur(lu && lu.modele)) { modifications.modele = valeur(lu.modele); repris.push('modèle'); }
    if (valeur(lu && lu.serie)) { modifications.serie = valeur(lu.serie); repris.push('n° de série'); }
    const fluide = KezLogic.fluidOf(valeur(lu && lu.fluide));
    if (fluide) { modifications.fluide = fluide.code; repris.push('fluide'); }
    const charge = valeur(lu && lu.chargeKg).replace(',', '.');
    if (charge && Number.isFinite(parseFloat(charge))) {
      modifications.charge = charge.replace('.', ',');
      repris.push('charge');
    }
    if (repris.length) { Object.assign(fiche, modifications); sauverBrouillon(); }
    return repris;
  }

  /* ---------- lecture de plaque à partir d'un texte ------------------------- */
  const MARQUES = ['MITSUBISHI ELECTRIC', 'MITSUBISHI HEAVY', 'MITSUBISHI', 'DAIKIN', 'HITACHI', 'TOSHIBA',
    'FUJITSU', 'GENERAL', 'PANASONIC', 'SAMSUNG', 'ATLANTIC', 'CARRIER', 'AIRWELL', 'AIRTON', 'CIAT',
    'CLIVET', 'AERMEC', 'LENNOX', 'TRANE', 'HAIER', 'MIDEA', 'GREE', 'HISENSE', 'SAUNIER DUVAL',
    'DE DIETRICH', 'VIESSMANN', 'VAILLANT', 'BOSCH', 'NIBE', 'STIEBEL ELTRON', 'THERMOR', 'ARISTON', 'LG'];

  function analyserPlaque(texte) {
    const brut = String(texte || '').toUpperCase();
    const compact = brut.replace(/\s+/g, ' ');
    const lignes = brut.split(/\r?\n/).map((l) => l.trim()).filter(Boolean);

    const marque = MARQUES.find((m) => compact.includes(m)) || '';

    const fluideMatch = compact.match(/R\s*-?\s*(1234\s*YF|1234\s*ZE|410\s*A|407\s*[CF]|404\s*A|448\s*A|449\s*A|452\s*B|454\s*[BC]|513\s*A|427\s*A|422\s*D|134\s*A|744|290|32|22)\b/);
    let fluide = '';
    if (fluideMatch) {
      const code = 'R' + fluideMatch[1].replace(/\s+/g, '');
      const trouve = KezLogic.fluidOf(code);
      fluide = trouve ? trouve.code : '';
    }

    let charge = '';
    const etiquette = compact.match(/(?:CHARGE|REFRIGERANT|REFRIG|FLUIDE|GAS|GWP|AMOUNT)[^0-9]{0,32}([0-9]+(?:[.,][0-9]+)?)\s*(KG|G)\b/);
    const brutKg = compact.match(/([0-9]+[.,][0-9]+)\s*KG\b/);
    const brutG = compact.match(/([0-9]{2,5})\s*G\b/);
    if (etiquette) {
      const valeur = parseFloat(etiquette[1].replace(',', '.'));
      charge = etiquette[2] === 'G' ? (valeur / 1000).toFixed(3) : String(valeur);
    } else if (brutKg) charge = brutKg[1].replace(',', '.');
    else if (brutG) charge = (parseInt(brutG[1], 10) / 1000).toFixed(3);

    const parLigne = (regex) => {
      for (const ligne of lignes) {
        const m = ligne.match(regex);
        if (m && m[1]) return m[1].replace(/^[.:#\s-]+/, '').trim();
      }
      return '';
    };
    const modele = parLigne(/(?:MODEL(?:E|\.|\sNO\.?|\sNAME)?|MODÈLE|TYPE|MOD\.)[^A-Z0-9]{0,10}([A-Z0-9][A-Z0-9/._-]{3,})/);
    const serie = parLigne(/(?:SERIAL(?:\sNO\.?|\sNUMBER)?|S\/?N|SÉRIE|SERIE|PRODUCT\sNO\.?)[^A-Z0-9]{0,10}([A-Z0-9][A-Z0-9/._-]{3,})/);

    return { marque, modele, serie, fluide, charge };
  }

  /* ---------- images -------------------------------------------------------- */
  function chargerImage(src) {
    return new Promise((resolve, reject) => {
      const img = new Image();
      img.onload = () => resolve(img);
      img.onerror = () => reject(new Error('image illisible'));
      img.src = src;
    });
  }

  function lireFichier(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result);
      reader.onerror = () => reject(new Error('lecture impossible'));
      reader.readAsDataURL(file);
    });
  }

  /* Décodage tolérant : createImageBitmap gère l'orientation et davantage de
     formats ; l'URL d'objet évite de charger un énorme base64 en mémoire. */
  async function decoderImage(file) {
    if (typeof createImageBitmap === 'function') {
      try {
        const bitmap = await createImageBitmap(file);
        if (bitmap && bitmap.width) return bitmap;
      } catch (e) { /* on tente la voie classique */ }
    }
    const url = URL.createObjectURL(file);
    try {
      return await chargerImage(url);
    } finally {
      setTimeout(() => URL.revokeObjectURL(url), 15000);
    }
  }

  function versJpeg(source, maxCote, qualite) {
    const largeur = source.width, hauteur = source.height;
    if (!largeur || !hauteur) throw new Error('image de taille nulle');
    const ratio = Math.min(1, maxCote / Math.max(largeur, hauteur));
    const canvas = el('canvas', {
      width: Math.max(1, Math.round(largeur * ratio)),
      height: Math.max(1, Math.round(hauteur * ratio)),
    });
    const ctx = canvas.getContext('2d');
    if (!ctx) throw new Error('canvas indisponible');
    ctx.fillStyle = '#fff';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.drawImage(source, 0, 0, canvas.width, canvas.height);
    const sortie = canvas.toDataURL('image/jpeg', qualite);
    if (!sortie || sortie.length < 200) throw new Error('conversion impossible');
    return sortie;
  }

  async function reduireImage(dataUrl, maxCote, qualite) {
    return versJpeg(await chargerImage(dataUrl), maxCote, qualite);
  }

  function dataUrlVersOctets(dataUrl) {
    const base64 = String(dataUrl || '').split(',')[1];
    return base64 ? KezPdf.b64ToBytes(base64) : new Uint8Array(0);
  }

  /* ---------- pad de signature --------------------------------------------- */
  function padSignature(libelle, cle) {
    const canvas = el('canvas', { width: 960, height: 300 });
    const ctx = canvas.getContext('2d');
    let dessine = false, vide = true;

    const fond = () => { ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, canvas.width, canvas.height); };
    fond();

    if (fiche[cle]) {
      chargerImage(fiche[cle]).then((img) => {
        const ratio = Math.min(canvas.width / img.width, canvas.height / img.height) * 0.92;
        const w = img.width * ratio, h = img.height * ratio;
        ctx.drawImage(img, (canvas.width - w) / 2, (canvas.height - h) / 2, w, h);
        vide = false;
      }).catch(() => {});
    }

    const point = (ev) => {
      const rect = canvas.getBoundingClientRect();
      return {
        x: (ev.clientX - rect.left) * (canvas.width / rect.width),
        y: (ev.clientY - rect.top) * (canvas.height / rect.height),
      };
    };
    canvas.addEventListener('pointerdown', (ev) => {
      ev.preventDefault();
      canvas.setPointerCapture(ev.pointerId);
      dessine = true; vide = false;
      const p = point(ev);
      ctx.beginPath(); ctx.moveTo(p.x, p.y);
      ctx.lineTo(p.x + 0.1, p.y + 0.1);
      ctx.lineWidth = 4.5; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.strokeStyle = '#0b1a2a';
      ctx.stroke();
    });
    canvas.addEventListener('pointermove', (ev) => {
      if (!dessine) return;
      ev.preventDefault();
      const p = point(ev);
      ctx.lineWidth = 4.5; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.strokeStyle = '#0b1a2a';
      ctx.lineTo(p.x, p.y); ctx.stroke();
    });
    const fin = () => {
      if (!dessine) return;
      dessine = false;
      fiche[cle] = vide ? '' : rogner(canvas);
      sauverBrouillon();
    };
    canvas.addEventListener('pointerup', fin);
    canvas.addEventListener('pointercancel', fin);
    canvas.addEventListener('pointerleave', fin);

    const effacer = () => {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      fond(); vide = true; fiche[cle] = ''; sauverBrouillon();
    };

    return el('div', { class: 'sign' },
      el('header', {}, el('b', {}, libelle), el('button', { type: 'button', onclick: effacer }, 'Effacer')),
      canvas,
      el('p', {}, 'Signer avec le doigt ou un stylet'));
  }

  /** Recadre la signature sur son tracé puis exporte en JPEG. */
  function rogner(canvas) {
    const ctx = canvas.getContext('2d');
    const data = ctx.getImageData(0, 0, canvas.width, canvas.height).data;
    let minX = canvas.width, minY = canvas.height, maxX = -1, maxY = -1;
    for (let y = 0; y < canvas.height; y++) {
      for (let x = 0; x < canvas.width; x++) {
        const i = (y * canvas.width + x) * 4;
        if (data[i] < 200 || data[i + 1] < 200 || data[i + 2] < 200) {
          if (x < minX) minX = x; if (x > maxX) maxX = x;
          if (y < minY) minY = y; if (y > maxY) maxY = y;
        }
      }
    }
    if (maxX < 0) return '';
    const marge = 10;
    minX = Math.max(0, minX - marge); minY = Math.max(0, minY - marge);
    maxX = Math.min(canvas.width - 1, maxX + marge); maxY = Math.min(canvas.height - 1, maxY + marge);
    const out = el('canvas', { width: maxX - minX + 1, height: maxY - minY + 1 });
    const octx = out.getContext('2d');
    octx.fillStyle = '#ffffff'; octx.fillRect(0, 0, out.width, out.height);
    octx.drawImage(canvas, minX, minY, out.width, out.height, 0, 0, out.width, out.height);
    return out.toDataURL('image/jpeg', 0.92);
  }

  function etapeEquipement() {

      if (file) await importerPhoto(file);
    };

    const importerPhoto = async (file) => {
      analyse.enCours = false;
      annoncerAnalyse('Ouverture de la photo…', false);

      let image;
      try {
        image = await decoderImage(file);
      } catch (e) {
        const nom = (file.name || '').toLowerCase();
        annoncerAnalyse(
          /\.hei[cf]$/.test(nom) || /hei[cf]/.test(file.type || '')
            ? "Photo au format HEIC, que ce navigateur ne sait pas ouvrir. Sur l'iPhone : Réglages > Appareil photo > Formats > Le plus compatible, puis reprends la photo."
            : "Photo illisible (" + (file.type || 'format inconnu') + '). Essaie une autre photo ou reprends-la avec l\'appareil photo.',
          true);
        return;
      }

      try {
        fiche.photo = versJpeg(image, 1100, 0.62);
        photoAnalyse = versJpeg(image, 1400, 0.9);
      } catch (e) {
        annoncerAnalyse('Photo trop grande pour cet appareil : reprends-la en résolution plus basse.', true);
        return;
      }
      if (image.close) { try { image.close(); } catch (e) { /* rien */ } }

      if (!sauverBrouillon()) {
        annoncerAnalyse("Mémoire du navigateur pleine : la photo n'est pas conservée. Exporte ta sauvegarde depuis Fiches.", true);
      }
      apercu.textContent = '';
      apercu.appendChild(el('img', { src: fiche.photo, alt: 'Plaque signalétique' }));

      const sample = await capaciteAnalyse();
      construire();
      if (sample) {
        void lirePlaque(false);
      } else {
        annoncerAnalyse(
          "Photo enregistrée. La lecture automatique n'est disponible que sur la version publiée en ligne : "
          + 'ici, colle le texte de la plaque ci-dessous.',
          false);
      }
    };

    const texte = el('textarea', { rows: 3, placeholder: "Coller ici le texte de la plaque (iPhone : appareil photo → sélectionner le texte → copier)" });
    const analyser = async () => {
      const contenu = texte.value.trim();
      if (!contenu) { annoncerAnalyse('Colle d\'abord le texte de la plaque.', true); return; }

      await capaciteAnalyse();

      // Quand la lecture est disponible, c'est Claude qui structure le texte :
      // il encaisse le désordre, les tableaux et les découpages approximatifs.
      if (analyse.texte) {
        analyse.enCours = true;
        annoncerAnalyse('', false);
        try {
          const lu = await analyse.texte.json(inviteTexte(contenu), { modelTier: 'default' });
          analyse.enCours = false;
          const repris = appliquerLecture(lu);
          if (!repris.length) {
            annoncerAnalyse((lu && lu.lisible === false)
              ? "Ce texte ne ressemble pas à une plaque signalétique."
              : "Rien d'exploitable dans ce texte.", true);
            return;
          }
          analyse.message = 'Repris du texte : ' + repris.join(', ') + '. Vérifie chaque valeur.';
          analyse.erreur = false;
          construire();
          return;
        } catch (erreur) {
          analyse.enCours = false;
          const code = erreur && erreur.code;
          if (code !== 'cancelled') {
            annoncerAnalyse((MESSAGES_IA[code] || 'Lecture impossible pour le moment.')
              + ' Analyse simple appliquée.', true);
          }
        }
      }

      // Repli sans IA : reconnaissance par motifs.
      const res = analyserPlaque(contenu);
      const touches = [];
      for (const [cle, brut] of Object.entries(res)) {
        if (!brut) continue;
        fiche[cle] = cle === 'charge' ? String(brut).replace('.', ',') : brut;
        touches.push(cle);
      }
      if (!touches.length) { annoncerAnalyse('Rien de reconnu dans ce texte.', true); return; }
      sauverBrouillon();
      analyse.message = 'Repris du texte : ' + touches.join(', ') + '. Vérifie chaque valeur.';
      analyse.erreur = false;
      construire();
    };

    // La disponibilité de la lecture est vérifiée dès l'ouverture de l'étape,
    // pas seulement au moment de la photo : l'utilisateur sait à quoi s'attendre.
    if (analyse.capacite === undefined) {
      capaciteAnalyse().then(() => construire()).catch(() => majEtatAnalyse());

  /* ---------- génération ---------------------------------------------------- */
  async function genererEtPartager() {
    const { erreurs } = KezLogic.validation(fiche);
    if (erreurs.length) { toast(erreurs[0], 'err'); return; }
    try {
      const signatures = {
        operateur: { bytes: dataUrlVersOctets(fiche.signOpImg) },
        detenteur: { bytes: dataUrlVersOctets(fiche.signDetImg) },
      };
      const octets = KezLogic.genererPdf(fiche, signatures);
      const nom = KezLogic.nomFichier(fiche);
      const blob = new Blob([octets], { type: 'application/pdf' });
      enregistrerFiche();
      await livrer(blob, nom);
    } catch (erreur) {
      console.error(erreur);
      toast('Génération impossible : ' + erreur.message, 'err');
    }
  }

  const estIOS = () => /iP(hone|ad|od)/.test(navigator.userAgent) ||
    (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

  /* Page publiée sur claude.ai : l'enregistrement passe par la plateforme.
     En fichier local, window.claude n'existe pas et on garde les voies
     habituelles (partage iOS, téléchargement). */
  /* Dans une page publiée, le PDF ne peut sortir que par la plateforme : le
     cadre d'affichage bloque les téléchargements ordinaires. On vérifie donc
     tôt, pour le dire avant que la fiche soit remplie pour rien. */
  const sortie = { capacite: undefined, dansClaude: false };
  let sondeSortie = null;

  function capaciteEnregistrement() {
    if (sondeSortie) return sondeSortie;
    sondeSortie = (async () => {
      if (typeof window.claude === 'undefined' || typeof window.claude.use !== 'function') return null;
      sortie.dansClaude = true;
      try { return await window.claude.use('downloads'); } catch (e) { return null; }
    })().then((v) => { sortie.capacite = v; return v; })
      .catch(() => { sortie.capacite = null; return null; });
    return sondeSortie;
  }

  async function livrer(blob, nom) {
    const plateforme = await capaciteEnregistrement();
    if (plateforme) {
      try {
        await plateforme.save({ filename: nom, data: blob });
        toast('Enregistré : ' + nom);
      } catch (e) {
        const code = e && e.code;
        if (code === 'declined') toast('Enregistrement annulé.');
        else if (code === 'rate_limited') toast('Une demande est déjà en cours, réessaie dans un instant.', 'err');
        else toast('Enregistrement impossible : ' + ((e && e.message) || 'erreur inconnue'), 'err');
      }
      return;
    }

    const file = new File([blob], nom, { type: blob.type || 'application/octet-stream' });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      try {
        await navigator.share({ files: [file], title: nom });
        toast('CERFA généré.');
        return;
      } catch (e) {
        if (e && e.name === 'AbortError') return;
      }
    }
    const url = URL.createObjectURL(blob);
    if (estIOS()) {
      // iOS ignore l'attribut download : on ouvre le document, le partage se
      // fait ensuite depuis la visionneuse (Enregistrer dans Fichiers, Mail…).
      window.open(url, '_blank');
      toast('Document ouvert : utilise le bouton Partager pour l\'enregistrer.');
    } else {
      const lien = el('a', { href: url, download: nom });
      document.body.appendChild(lien);
      lien.click();
      lien.remove();
      toast('Fichier généré : ' + nom);
    }
    setTimeout(() => URL.revokeObjectURL(url), 120000);
  }

  function enregistrerFiche() {
    const copie = JSON.parse(JSON.stringify(fiche));
    if (!reglages.garderPhotos) copie.photo = '';
    copie.modifie = new Date().toISOString();
    const index = fiches.findIndex((f) => f.id === copie.id);
    if (index >= 0) fiches[index] = copie; else fiches.unshift(copie);
    if (!sauverFiches() && copie.photo) {
      copie.photo = '';
      sauverFiches();
    }
    const numero = parseInt(String(fiche.ficheNo).replace(reglages.prefixe, ''), 10);
    if (Number.isFinite(numero) && numero >= reglages.compteur) {
      reglages.compteur = numero + 1;
      sauverReglages();
    }
  }

  async function regenerer(item) {
    try {
      const signatures = {
        operateur: { bytes: dataUrlVersOctets(item.signOpImg) },
        detenteur: { bytes: dataUrlVersOctets(item.signDetImg) },
      };
      const octets = KezLogic.genererPdf(item, signatures);
      await livrer(new Blob([octets], { type: 'application/pdf' }), KezLogic.nomFichier(item));
    } catch (e) { toast('Génération impossible : ' + e.message, 'err'); }
  }

  function exporter() {
    const donnees = { format: 'kez-cerfa', version: 1, exporte: new Date().toISOString(), reglages, fiches };
    const blob = new Blob([JSON.stringify(donnees, null, 1)], { type: 'application/json' });
    livrer(blob, 'kez-cerfa-sauvegarde-' + aujourdhui() + '.json');
  }

  async function importer(ev) {
    const file = ev.currentTarget.files && ev.currentTarget.files[0];
    ev.currentTarget.value = '';
    if (!file) return;
    try {
      const donnees = JSON.parse(await file.text());
      if (!donnees || !Array.isArray(donnees.fiches)) throw new Error('fichier non reconnu');
      const connus = new Set(fiches.map((f) => f.id));
      let ajoutees = 0;
      for (const item of donnees.fiches) {
        if (item && item.id && !connus.has(item.id)) { fiches.push(item); ajoutees++; }
      }
      fiches.sort((a, b) => String(b.cree || '').localeCompare(String(a.cree || '')));
      sauverFiches();
      construire();
      toast(ajoutees + ' fiche(s) importée(s).');
    } catch (e) { toast('Import impossible : ' + e.message, 'err'); }
  }

  /* ---------- rendu général --------------------------------------------------- */
  const RENDUS = [etapeClient, etapeEquipement, etapeIntervention, etapeFluide, etapeSignatures];

  function construire() {
    const racine = $('#app');
    racine.textContent = '';

    const barreEtapes = $('#steps');
    barreEtapes.classList.toggle('hidden', vue !== 'saisie');
    if (vue === 'saisie' && !barreEtapes.children.length) {
      ETAPES.forEach((nom, i) => {
        barreEtapes.appendChild(el('button', {
          type: 'button',
          onclick: () => { etape = i; construire(); },
        }, el('span', { class: 'n' }, String(i + 1)), el('b', {}, nom)));
      });
    }

    if (vue === 'saisie') racine.appendChild(RENDUS[etape]());
    else if (vue === 'historique') racine.appendChild(vueHistorique());
    else racine.appendChild(vueReglages());

    const actions = $('#actions');
    actions.textContent = '';
    const inner = el('div', { class: 'inner' });
    if (vue === 'saisie') {
      inner.appendChild(el('button', {
        type: 'button', class: 'btn', disabled: etape === 0,
        onclick: () => { etape = Math.max(0, etape - 1); construire(); window.scrollTo(0, 0); },
      }, 'Retour'));
      if (etape < ETAPES.length - 1) {
        inner.appendChild(el('button', {
          type: 'button', class: 'btn dark',
          onclick: () => { etape = Math.min(ETAPES.length - 1, etape + 1); construire(); window.scrollTo(0, 0); },
        }, 'Continuer'));
      } else {
        inner.appendChild(el('button', { type: 'button', class: 'btn primary', onclick: genererEtPartager }, 'Générer le PDF'));
      }
    } else {
      inner.appendChild(el('button', {
        type: 'button', class: 'btn dark block',
        onclick: () => { vue = 'saisie'; construire(); },
      }, 'Retour à la fiche'));
    }
    actions.appendChild(inner);

    rafraichir();
  }

  /* ---------- barre supérieure ------------------------------------------------ */
  function initTopbar() {
    $('#btn-nouvelle').addEventListener('click', () => {
      if (!confirmer('Commencer une nouvelle fiche ? La saisie en cours sera remplacée.', true)) return;
      fiche = ficheVierge();
      sauverBrouillon();
      vue = 'saisie'; etape = 0;
      construire();
      window.scrollTo(0, 0);
    });
    const onglet = (id, cible) => $(id).addEventListener('click', () => {
      vue = vue === cible ? 'saisie' : cible;
      construire();
      window.scrollTo(0, 0);
      for (const [bouton, nom] of [[$('#btn-historique'), 'historique'], [$('#btn-reglages'), 'reglages']]) {
        bouton.setAttribute('aria-current', vue === nom ? 'true' : 'false');
      }
    });
    onglet('#btn-historique', 'historique');
    onglet('#btn-reglages', 'reglages');
  }

  document.addEventListener('paste', (event) => {
    if (vue !== 'saisie' || etape !== 1) return;
    const file = imageDuPressePapiers(event);
    if (!file) return;
    event.preventDefault();
    const zone = document.querySelector('.photo');
    if (zone && zone.__importer) void zone.__importer(file);
  });

  initTopbar();
  construire();
  capaciteEnregistrement().then(() => majEtatSortie());
})();


</script>
<script>
/* Installation hors ligne : le service worker garde l'application en cache.
   Il ne s'active qu'en https (ou sur localhost). */
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js').catch(function () {});
  });
}
</script>
