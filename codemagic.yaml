workflows:
  build-android:
    name: Build Android APK
    max_build_duration: 60
    environment:
      flutter: stable
    scripts:
      - flutter pub get
      - |
          if [ ! -d "android" ]; then
            echo "Android folder missing -> creating it"
            flutter create . --platforms=android
          fi
      - flutter build apk --debug
    artifacts:
      - build/app/outputs/flutter-apk/app-debug.apk
